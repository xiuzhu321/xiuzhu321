name: Windows Cloud RDP



on:

  workflow_dispatch:



jobs:

  build:

    runs-on: windows-latest

    timeout-minutes: 360



    steps:

      - name: 1. Enable Remote Desktop & Firewall

        run: |

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0



      - name: 2. Create Admin Account

        run: |

          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force

          New-LocalUser -Name "NvdAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue

          Add-LocalGroupMember -Group "Administrators" -Member "NvdAdmin" -ErrorAction SilentlyContinue

          net user runneradmin P@ssw0rd1qazXSW@#



      - name: 3. Install & Connect Tailscale VPN
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          # Confirm the Tailscale auth key is configured.
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY is missing. Add it under repository Settings > Secrets and variables > Actions."
          }

          # Download and install Tailscale silently.
          $installer = "$env:TEMP\tailscale-setup-latest-amd64.msi"
          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          $install = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList @("/i", "`"$installer`"", "/quiet", "/norestart") `
            -Wait `
            -PassThru

          if ($install.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed with exit code $($install.ExitCode)."
          }

          # Wait for the Tailscale CLI to become available.
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $ready = $false
          for ($i = 0; $i -lt 15; $i++) {
            if (Test-Path $tailscale) {
              $ready = $true
              break
            }
            Start-Sleep -Seconds 2
          }

          if (-not $ready) {
            throw "Tailscale executable was not found after installation."
          }

          # Connect to the Tailscale network.
          & $tailscale up "--authkey=$env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"
          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale failed to connect (exit code $LASTEXITCODE)."
          }

          Start-Sleep -Seconds 5

          # Get the Tailscale IPv4 address.
          $ts_ip = (& $tailscale ip -4 | Select-Object -First 1).Trim()
          if ([string]::IsNullOrWhiteSpace($ts_ip)) {
            throw "Could not obtain a Tailscale IPv4 address."
          }

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : NvdAdmin" -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "==========================================" -ForegroundColor Green

      - name: 4. Open Port 4533 and All Ports over Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Explicit rule for TCP 4533.
          New-NetFirewallRule `
            -DisplayName "Allow TCP 4533" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 4533 `
            -Profile Any `
            -ErrorAction SilentlyContinue

          # Allow inbound traffic on the Tailscale network interface only.
          # This avoids exposing every port directly to the public internet.
          $tailscaleAdapter = Get-NetAdapter |
            Where-Object { $_.InterfaceDescription -match "Tailscale" -or $_.Name -match "Tailscale" } |
            Select-Object -First 1

          if ($null -ne $tailscaleAdapter) {
            New-NetFirewallRule `
              -DisplayName "Allow All Inbound Ports over Tailscale" `
              -Direction Inbound `
              -Action Allow `
              -InterfaceAlias $tailscaleAdapter.Name `
              -Protocol Any `
              -Profile Any `
              -ErrorAction SilentlyContinue

            Write-Host "Firewall configured: TCP 4533 and all inbound ports over Tailscale."
            Write-Host "Tailscale adapter: $($tailscaleAdapter.Name)"
          }
          else {
            Write-Warning "Tailscale adapter not found. TCP 4533 rule was added, but the all-ports Tailscale rule was not created."
            Get-NetAdapter | Format-Table -AutoSize
          }

      - name: 5. Keep Server Alive (48 Hours)

        run: |

          for ($i = 1; $i -le 2880; $i++) {

              Start-Sleep -Seconds 60

              Write-Host "[$i/2880] Server running..."

          }
